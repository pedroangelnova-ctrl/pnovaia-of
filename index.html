<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PNova IA</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f9;
    --hover: #ececec;
    --active: #e6e6e8;
    --text: #0d0d0d;
    --muted: #6e6e73;
    --border: #e5e5e7;
    --user: #f0f0f2;
    --composer: #ffffff;
    --code-bg: #f4f5f7;
    --accent: #1d6ff2;
    --accent-grad: linear-gradient(135deg, #1fb6ff 0%, #3b5bf5 55%, #8b3cf6 100%);
    --danger: #d93025;
    --shadow: 0 2px 14px rgba(20, 30, 60, .08);
    --sidebar-w: 260px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --sidebar: #101114;
      --hover: #23252b;
      --active: #2a2d35;
      --text: #ececf1;
      --muted: #9a9ca6;
      --border: #2c2e36;
      --user: #2d2f37;
      --composer: #202228;
      --code-bg: #0f1013;
      --accent: #4c8dff;
      --danger: #ff7b72;
      --shadow: 0 2px 14px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .logo { display: block; background: #fff; border-radius: 22%; object-fit: contain; }

  /* ---------- Auth ---------- */
  #auth-view { height: 100%; display: grid; place-items: center; padding: 24px; overflow: auto; }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-card .logo { width: 64px; height: 64px; margin: 0 auto 18px; }
  .auth-card h1 { font-size: 26px; line-height: 1.2; text-align: center; margin: 0 0 6px; font-weight: 600; }
  .auth-card .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--hover); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs button { padding: 8px; border-radius: 9px; color: var(--muted); font-weight: 500; }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .btn-primary { width: 100%; height: 46px; border-radius: 12px; color: #fff; font-weight: 600; background: var(--accent-grad); margin-top: 6px; }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .notice { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .notice.error { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .notice.ok { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .notice.warn { background: var(--hover); color: var(--text); }
  .oauth-sep { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: var(--muted); font-size: 13px; }
  .oauth-sep::before, .oauth-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .btn-google { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-google:hover:not(:disabled) { background: var(--hover); }
  .btn-google:disabled { opacity: .55; cursor: default; }
  .btn-google svg { width: 18px; height: 18px; flex: none; }
  .legal-note { margin: 16px 0 0; text-align: center; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .legal-note a { color: var(--muted); text-decoration: underline; }
  .otp-input { text-align: center; font-size: 26px; letter-spacing: .45em; padding-left: .45em !important; font-variant-numeric: tabular-nums; }
  .link-btn { display: block; margin: 12px auto 0; color: var(--muted); font-size: 14px; text-decoration: underline; }
  .link-btn:disabled { opacity: .55; cursor: default; text-decoration: none; }
  .notice code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }

  /* ---------- App layout ---------- */
  #app-view { height: 100%; display: flex; }
  .sidebar {
    width: var(--sidebar-w); flex: none; background: var(--sidebar);
    display: flex; flex-direction: column; height: 100%;
    transition: margin-left .2s ease;
  }
  body.sidebar-collapsed .sidebar { margin-left: calc(var(--sidebar-w) * -1); }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 6px 14px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
  .brand .logo { width: 28px; height: 28px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .side-nav { padding: 6px 8px; }
  .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; text-align: left; }
  .nav-item:hover { background: var(--hover); }
  .search-box { padding: 4px 8px 6px; }
  .search-box input { width: 100%; height: 38px; border-radius: 10px; padding: 0 12px; border: 1px solid var(--border); background: var(--bg); }
  .side-label { padding: 14px 18px 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .chat-item { position: relative; display: flex; align-items: center; border-radius: 10px; }
  .chat-item:hover, .chat-item.menu-open { background: var(--hover); }
  .chat-item.active { background: var(--active); }
  .chat-open { flex: 1; min-width: 0; text-align: left; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 10px; }
  .chat-more { width: 30px; height: 30px; margin-right: 4px; border-radius: 8px; display: none; place-items: center; color: var(--muted); }
  .chat-item:hover .chat-more, .chat-item.active .chat-more, .chat-item.menu-open .chat-more, .chat-more:focus-visible { display: grid; }
  .chat-more:hover { color: var(--text); background: var(--active); }
  .rename-input { flex: 1; min-width: 0; margin: 3px 6px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--accent); background: var(--bg); }
  .list-empty { padding: 8px 12px; color: var(--muted); font-size: 14px; }
  .side-foot { padding: 8px; border-top: 1px solid var(--border); position: relative; }
  .user-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; text-align: left; }
  .user-btn:hover { background: var(--hover); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-grad); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .user-meta { min-width: 0; }
  .user-meta b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-meta small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .popover {
    position: fixed; z-index: 50; min-width: 190px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 6px;
  }
  .popover button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; text-align: left; }
  .popover button:hover:not(:disabled) { background: var(--hover); }
  .popover button:disabled { color: var(--muted); cursor: default; }
  .popover .danger { color: var(--danger); }
  .popover .opt-text { flex: 1; min-width: 0; }
  .popover .opt-text small { display: block; color: var(--muted); font-size: 12px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; position: relative; }
  .topbar { height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 10px; flex: none; }
  .topbar .only-collapsed { display: none; }
  body.sidebar-collapsed .topbar .only-collapsed { display: grid; }
  .model-btn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; font-size: 18px; font-weight: 600; color: var(--muted); }
  .model-btn:hover { background: var(--hover); color: var(--text); }
  .model-btn .i { width: 16px; height: 16px; }

  #body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .col { width: 100%; max-width: 768px; margin: 0 auto; padding: 0 20px; }

  #empty { display: none; text-align: center; padding-bottom: 22px; }
  #empty .logo { width: 64px; height: 64px; margin: 0 auto 16px; }
  #empty h1 { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 600; }
  .is-empty #empty { display: block; }
  .is-empty #scroll { flex: none; overflow: visible; }
  .is-empty #body { justify-content: center; padding-bottom: 8vh; }
  .is-empty #disclaimer { display: none; }

  #messages { padding-top: 12px; padding-bottom: 24px; }
  .msg { margin: 18px 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user { margin-left: auto; }
  .msg.user .bubble { max-width: min(85%, 560px); width: fit-content; background: var(--user); color: var(--text); padding: 10px 18px; border-radius: 24px 24px 6px 24px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant .content { font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
  .content p { margin: 0 0 14px; }
  .content p:last-child, .content ul:last-child, .content ol:last-child { margin-bottom: 0; }
  .content ul, .content ol { margin: 0 0 14px; padding-left: 24px; }
  .content li { margin: 3px 0; }
  .content code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .88em; background: var(--code-bg); padding: 2px 6px; border-radius: 6px; }
  .content pre { margin: 0 0 14px; background: var(--code-bg); border-radius: 14px; padding: 14px 16px; overflow-x: auto; }
  .content pre code { background: none; padding: 0; font-size: 14px; line-height: 1.55; }
  .msg-actions { display: flex; gap: 2px; margin-top: 6px; margin-left: -8px; }
  .msg-actions .icon-btn { width: 32px; height: 32px; }
  .msg-actions .i { width: 18px; height: 18px; }
  .typing { display: inline-flex; gap: 5px; padding: 8px 0; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .5; animation: blink 1.1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  .msg-error { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }
  .msg-error button { text-decoration: underline; font-weight: 600; }

  #composer-wrap { flex: none; padding: 0 0 12px; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px; background: var(--composer);
    border: 1px solid var(--border); border-radius: 28px; padding: 8px 8px 8px 20px; box-shadow: var(--shadow);
  }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .composer textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; max-height: 200px; padding: 8px 0; line-height: 1.5; font-size: 16px; }
  .composer textarea::placeholder { color: var(--muted); }
  .send { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--accent-grad); flex: none; }
  .send:disabled { opacity: .3; cursor: default; }
  #disclaimer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 20px 0; }

  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 80; max-width: 90vw; }
  .overlay { display: none; }

  /* ---------- Móvil ---------- */
  @media (max-width: 800px) {
    .sidebar { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; margin-left: calc(var(--sidebar-w) * -1) !important; box-shadow: none; transition: margin-left .2s ease; }
    body.sidebar-open .sidebar { margin-left: 0 !important; box-shadow: 4px 0 24px rgba(0,0,0,.25); }
    body.sidebar-open .overlay { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); }
    .topbar .only-collapsed { display: grid !important; }
    #empty h1 { font-size: 24px; }
    .is-empty #body { justify-content: flex-end; padding-bottom: 0; }
    .is-empty #scroll { flex: 1; display: grid; align-content: center; overflow: auto; }
    .is-empty #disclaimer { display: block; }
    #composer-wrap { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<!-- ================= AUTENTICACIÓN ================= -->
<section id="auth-view" hidden>
  <div class="auth-card">
    <img class="logo" src="logo.png" alt="PNova IA">
    <h1 id="auth-title">Inicia sesión en PNova IA</h1>
    <p class="sub" id="auth-sub">Tus chats se guardan en tu cuenta.</p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Iniciar sesión</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false">Crear cuenta</button>
    </div>

    <form id="auth-form" novalidate>
      <label class="field" id="name-field" hidden>
        <span>Nombre</span>
        <input id="auth-name" type="text" autocomplete="name" maxlength="60">
      </label>
      <label class="field">
        <span>Correo electrónico</span>
        <input id="auth-email" type="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <button class="btn-primary" id="auth-submit" type="submit">Iniciar sesión</button>
    </form>
    <div id="oauth-block">
      <div class="oauth-sep"><span>o</span></div>
      <button class="btn-google" id="btn-google" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Continuar con Google
      </button>
    </div>
    <form id="otp-form" novalidate hidden>
      <label class="field">
        <span>Código de verificación</span>
        <input id="otp-code" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••" required>
      </label>
      <button class="btn-primary" id="otp-submit" type="submit">Verificar correo</button>
      <button class="link-btn" id="otp-resend" type="button">Reenviar código</button>
      <button class="link-btn" id="otp-back" type="button">Cambiar correo</button>
    </form>
    <p class="legal-note" id="legal-note">Al continuar aceptas las <a href="/condiciones-del-servicio" target="_blank" rel="noopener">Condiciones del servicio</a> y la <a href="/politica-de-privacidad" target="_blank" rel="noopener">Política de privacidad</a>.</p>
    <div id="auth-notice" class="notice" role="status" hidden></div>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app-view" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Barra lateral">
    <div class="side-head">
      <div class="brand"><img class="logo" src="logo.png" alt=""><span>PNova IA</span></div>
      <button class="icon-btn" id="btn-search" type="button" aria-label="Buscar chats"><span data-icon="search"></span></button>
      <button class="icon-btn" id="btn-collapse" type="button" aria-label="Cerrar barra lateral"><span data-icon="panel"></span></button>
    </div>
    <div class="side-nav">
      <button class="nav-item" id="btn-new" type="button"><span data-icon="newchat"></span>Nuevo chat</button>
    </div>
    <div class="search-box" id="search-box" hidden>
      <input id="search-input" type="search" placeholder="Buscar chats" aria-label="Buscar chats">
    </div>
    <div class="side-label">Recientes</div>
    <nav class="chat-list" id="chat-list" aria-label="Chats recientes"></nav>
    <div class="side-foot">
      <button class="user-btn" id="user-btn" type="button" aria-haspopup="menu">
        <span class="avatar" id="user-avatar">P</span>
        <span class="user-meta"><b id="user-name">Usuario</b><small id="user-email"></small></span>
      </button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main id="main" class="is-empty">
    <header class="topbar">
      <button class="icon-btn only-collapsed" id="btn-open" type="button" aria-label="Abrir barra lateral"><span data-icon="panel"></span></button>
      <button class="icon-btn only-collapsed" id="btn-new2" type="button" aria-label="Nuevo chat"><span data-icon="newchat"></span></button>
      <button class="model-btn" id="model-btn" type="button" aria-haspopup="menu"><span id="model-name">PNova</span><span data-icon="chevron"></span></button>
    </header>

    <div id="body">
      <div id="scroll">
        <div class="col">
          <div id="empty">
            <img class="logo" src="logo.png" alt="">
            <h1>¿En qué puedo ayudarte?</h1>
          </div>
          <div id="messages" aria-live="polite"></div>
        </div>
      </div>
      <div id="composer-wrap">
        <div class="col">
          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Pregunta a PNova IA" aria-label="Mensaje"></textarea>
            <button class="send" id="send" type="submit" aria-label="Enviar mensaje" disabled><span data-icon="send"></span></button>
          </form>
        </div>
        <div id="disclaimer">PNova IA puede cometer errores. Comprueba la información importante.</div>
      </div>
    </div>
  </main>
</div>

<div id="toast" role="alert" hidden></div>

  chevron: '<path d="m6 9 6 6 6-6"/>',
  send: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',

const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll("[data-icon]").forEach(el => { el.outerHTML = icon(el.dataset.icon); });

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

/* Markdown mínimo y seguro: bloques de código, `código`, **negrita** y listas */
function renderMd(src) {
  return String(src).split("```").map((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      const code = nl > -1 ? part.slice(nl + 1) : part;
      return `<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`;
    }
    return part.split(/\n{2,}/).map(block => {
      block = block.trim();
      if (!block) return "";
      const lines = block.split("\n");
      const inline = t => esc(t).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      if (lines.every(l => /^\s*[-*]\s+/.test(l)))
        return "<ul>" + lines.map(l => `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`).join("") + "</ul>";
      if (lines.every(l => /^\s*\d+[.)]\s+/.test(l)))
        return "<ol>" + lines.map(l => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>";
      return `<p>${lines.map(inline).join("<br>")}</p>`;
    }).join("");
  }).join("");
}

const configured = !CONFIG.SUPABASE_URL.includes("TU-PROYECTO") && !CONFIG.SUPABASE_ANON_KEY.startsWith("TU_");
let sb = null;
let user = null, profile = null;
let conversations = [], currentId = null, messages = [];
let sending = false, loadingConv = false, lastFailed = false;
let modelId = store.get("pnova.model") || CONFIG.DEFAULT_MODEL;

/* =====================================================================
   Autenticación
   ===================================================================== */
let authMode = "login";

function setAuthMode(mode) {
  authMode = mode;
  const reg = mode === "register";
  $("#tab-login").setAttribute("aria-selected", String(!reg));
  $("#tab-register").setAttribute("aria-selected", String(reg));
  $("#name-field").hidden = !reg;
  $("#auth-title").textContent = reg ? "Crea tu cuenta en PNova IA" : "Inicia sesión en PNova IA";
  $("#auth-submit").textContent = reg ? "Crear cuenta" : "Iniciar sesión";
  $("#auth-password").autocomplete = reg ? "new-password" : "current-password";
  showNotice();
}
function showNotice(text, kind = "error") {
  const n = $("#auth-notice");
  if (!text) { n.hidden = true; return; }
  n.className = "notice " + kind; n.textContent = text; n.hidden = false;
}
function authError(err) {
  const m = (err && err.message || "").toLowerCase();
  if (m.includes("invalid login")) return "Correo o contraseña incorrectos.";
  if (m.includes("already registered")) return "Ya existe una cuenta con ese correo.";
  if (m.includes("not confirmed")) return "Confirma tu correo antes de iniciar sesión. Revisa tu bandeja de entrada.";
  if (m.includes("at least")) return "La contraseña debe tener al menos 6 caracteres.";
  if (m.includes("rate limit") || m.includes("too many")) return "Demasiados intentos. Espera un momento y vuelve a probar.";
  if (m.includes("valid email") || m.includes("invalid email")) return "Escribe un correo válido.";
  if (m.includes("failed to fetch") || m.includes("network")) return "No se pudo conectar con Supabase. Revisa tu conexión.";
  return (err && err.message) || "No se pudo completar la acción.";
}

$("#tab-login").onclick = () => setAuthMode("login");
$("#tab-register").onclick = () => setAuthMode("register");

$("#auth-form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!sb) return;
  const email = $("#auth-email").value.trim();
  const password = $("#auth-password").value;
  const name = $("#auth-name").value.trim();
  if (!email || !password) return showNotice("Escribe tu correo y tu contraseña.");
  if (authMode === "register" && password.length < 6) return showNotice("La contraseña debe tener al menos 6 caracteres.");

  const btn = $("#auth-submit"); btn.disabled = true; showNotice();
  try {
    if (authMode === "login") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: {
          data: { display_name: name || email.split("@")[0] },
          emailRedirectTo: location.origin + location.pathname
        }
      });
      if (error) throw error;
      if (data.user && data.user.identities && data.user.identities.length === 0)
        throw new Error("User already registered");
      if (!data.session) showOtpStep(email);   // sin sesión = falta verificar el correo con el código
    }
  } catch (err) {
    showNotice(authError(err));
  } finally {
    btn.disabled = false;
  }
});


/* ---------- Iniciar sesión con Google ---------- */
$("#btn-google").onclick = async () => {
  if (!sb) return;
  const btn = $("#btn-google"); btn.disabled = true; showNotice();
  try {
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname }
    });
    if (error) throw error;   // si todo va bien, el navegador redirige a Google
  } catch (err) {
    btn.disabled = false;
    const m = (err && err.message || "").toLowerCase();
    showNotice(m.includes("not enabled") || m.includes("unsupported provider")
      ? "El inicio de sesión con Google no está activado en Supabase."
      : authError(err));
  }
};

/* ---------- Verificación del correo con código OTP ---------- */
let pendingEmail = null, resendTimer = null;

function showOtpStep(email) {
  pendingEmail = email;
  $("#auth-form").hidden = true;
  $("#oauth-block").hidden = true;
  document.querySelector(".tabs").hidden = true;
  $("#otp-form").hidden = false;
  $("#auth-title").textContent = "Verifica tu correo";
  $("#auth-sub").textContent = "Introduce el código que hemos enviado a " + email + ".";
  $("#otp-code").value = "";
  showNotice();
  startResendCooldown(60);
  $("#otp-code").focus();
}
function hideOtpStep() {
  pendingEmail = null;
  clearInterval(resendTimer);
  $("#otp-form").hidden = true;
  $("#auth-form").hidden = false;
  $("#oauth-block").hidden = false;
  document.querySelector(".tabs").hidden = false;
  $("#auth-sub").textContent = "Tus chats se guardan en tu cuenta.";
  setAuthMode("register");
}
function startResendCooldown(sec) {
  const b = $("#otp-resend");
  clearInterval(resendTimer);
  b.disabled = true;
  const tick = () => {
    if (sec <= 0) { clearInterval(resendTimer); b.disabled = false; b.textContent = "Reenviar código"; return; }
    b.textContent = "Reenviar código (" + sec-- + "s)";
  };
  tick(); resendTimer = setInterval(tick, 1000);
}

$("#otp-code").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); });
$("#otp-back").onclick = hideOtpStep;

$("#otp-form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!sb || !pendingEmail) return;
  const token = $("#otp-code").value.trim();
  if (token.length < 6) return showNotice("Escribe el código completo que te llegó por correo.");
  const btn = $("#otp-submit"); btn.disabled = true; showNotice();
  try {
    const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token, type: "signup" });
    if (error) throw error;
    // Éxito: onAuthStateChange recibe SIGNED_IN y entra en la app.
  } catch (err) {
    const m = (err && err.message || "").toLowerCase();
    showNotice(m.includes("expired") || m.includes("invalid")
      ? "El código no es válido o ha caducado. Pide uno nuevo."
      : authError(err));
  } finally {
    btn.disabled = false;
  }
});

$("#otp-resend").onclick = async () => {
  if (!sb || !pendingEmail) return;
  showNotice();
  const { error } = await sb.auth.resend({ type: "signup", email: pendingEmail });
  if (error) return showNotice(authError(error));
  showNotice("Te hemos enviado un nuevo código.", "ok");
  startResendCooldown(60);
};

async function logout() {
  closePopover();
  const { error } = await sb.auth.signOut();
  if (error) toast("No se pudo cerrar la sesión.");
}

function showAuth() {
  user = null; profile = null; conversations = []; messages = []; currentId = null;
  $("#app-view").hidden = true;
  $("#auth-view").hidden = false;
  $("#auth-password").value = "";
  $("#btn-google").disabled = false;
  if (pendingEmail) { pendingEmail = null; clearInterval(resendTimer); $("#otp-form").hidden = true; $("#auth-form").hidden = false; $("#oauth-block").hidden = false; document.querySelector(".tabs").hidden = false; }
  if (!configured) {
    showNotice("Falta configurar Supabase: abre index.html y rellena SUPABASE_URL y SUPABASE_ANON_KEY en el bloque CONFIG.", "warn");
    $("#auth-submit").disabled = true;
    $("#btn-google").disabled = true;
  }
}

async function enterApp(session) {
  user = session.user;
  $("#auth-view").hidden = true;
  $("#app-view").hidden = false;
  setModelLabel();
  await loadProfile();
  await loadConversations();
  newChat();
}

async function loadProfile() {
  const fallbackName = (user.user_metadata && (user.user_metadata.display_name || user.user_metadata.full_name || user.user_metadata.name)) || (user.email || "").split("@")[0] || "Usuario";
  let { data, error } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (!error && !data) {
    // Por si el trigger de la base de datos aún no existía cuando se creó la cuenta
    const ins = await sb.from("profiles").upsert({ id: user.id, email: user.email, display_name: fallbackName }).select().maybeSingle();
    data = ins.data;
  }
  profile = data || { id: user.id, email: user.email, display_name: fallbackName };
  const name = profile.display_name || fallbackName;
  $("#user-name").textContent = name;
  $("#user-email").textContent = user.email || "";
  $("#user-avatar").textContent = (name[0] || "P").toUpperCase();
}

/* =====================================================================
   Conversaciones
   ===================================================================== */
async function loadConversations() {
  const { data, error } = await sb.from("conversations")
    .select("id,title,model,updated_at").order("updated_at", { ascending: false }).limit(200);
  if (error) { toast("No se pudieron cargar tus chats."); return; }
  conversations = data || [];
  renderList();
}

function renderList() {
  const q = $("#search-input").value.trim().toLowerCase();
  const list = $("#chat-list");
  const items = conversations.filter(c => !q || c.title.toLowerCase().includes(q));
  if (!items.length) {
    list.innerHTML = `<div class="list-empty">${q ? "Ningún chat coincide." : "Aún no tienes chats."}</div>`;
    return;
  }
  list.innerHTML = items.map(c => `
    <div class="chat-item${c.id === currentId ? " active" : ""}" data-id="${c.id}">
      <button class="chat-open" type="button" title="${esc(c.title)}">${esc(c.title)}</button>
      <button class="chat-more" type="button" aria-label="Opciones del chat" aria-haspopup="menu">${icon("dots")}</button>
    </div>`).join("");
}

$("#chat-list").addEventListener("click", e => {
  const item = e.target.closest(".chat-item");
  if (!item) return;
  const id = item.dataset.id;
  if (e.target.closest(".chat-more")) { openChatMenu(item, e.target.closest(".chat-more")); return; }
  if (e.target.closest(".chat-open")) { openConversation(id); closeSidebarMobile(); }
});

function newChat() {
  currentId = null; messages = []; lastFailed = false;
  renderList(); renderMessages();
  $("#input").focus({ preventScroll: true });
}

async function openConversation(id) {
  if (id === currentId || loadingConv) return;
  loadingConv = true;
  const { data, error } = await sb.from("messages")
    .select("id,role,content,model,created_at").eq("conversation_id", id).order("created_at", { ascending: true });
  loadingConv = false;
  if (error) { toast("No se pudo abrir el chat."); return; }
  currentId = id; messages = data || []; lastFailed = false;
  renderList(); renderMessages(); scrollDown(true);
}

function makeTitle(text) {
  const t = text.replace(/\s+/g, " ").trim();
  return t.length > 48 ? t.slice(0, 48).trimEnd() + "…" : t;
}

/* ---- menú de cada chat ---- */
function openChatMenu(item, anchor) {
  const id = item.dataset.id;
  item.classList.add("menu-open");
  openPopover(anchor, `
    <button type="button" data-act="rename">${icon("pencil")}Cambiar nombre</button>
    <button type="button" data-act="delete" class="danger">${icon("trash")}Eliminar</button>`,
    act => { if (act === "rename") startRename(item); if (act === "delete") deleteConversation(id); },
    () => item.classList.remove("menu-open"));
}

function startRename(item) {
  const id = item.dataset.id;
  const conv = conversations.find(c => c.id === id);
  const input = document.createElement("input");
  input.className = "rename-input"; input.value = conv.title; input.maxLength = 120;
  input.setAttribute("aria-label", "Nombre del chat");
  item.replaceChildren(input);
  input.focus(); input.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    const title = input.value.trim();
    if (save && title && title !== conv.title) {
      const { error } = await sb.from("conversations").update({ title }).eq("id", id);
      if (error) toast("No se pudo cambiar el nombre."); else conv.title = title;
    }
    renderList();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

async function deleteConversation(id) {
  const conv = conversations.find(c => c.id === id);
  if (!confirm(`¿Eliminar el chat "${conv ? conv.title : ""}"? Esta acción no se puede deshacer.`)) return;
  const { error } = await sb.from("conversations").delete().eq("id", id);
  if (error) { toast("No se pudo eliminar el chat."); return; }
  conversations = conversations.filter(c => c.id !== id);
  if (currentId === id) newChat(); else renderList();
}

/* =====================================================================
   Mensajes
   ===================================================================== */
function renderMessages(typing = false) {
  const main = $("#main");
  const empty = !messages.length && !typing && !lastFailed;
  main.classList.toggle("is-empty", empty);
  const box = $("#messages");
  box.innerHTML = messages.map((m, i) => m.role === "user"
    ? `<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>`
    : `<div class="msg assistant"><div class="content">${renderMd(m.content)}</div>
         <div class="msg-actions"><button class="icon-btn" type="button" data-copy="${i}" aria-label="Copiar respuesta" title="Copiar">${icon("copy")}</button></div></div>`
  ).join("")
  + (typing ? `<div class="msg assistant" aria-label="PNova IA está escribiendo"><div class="typing"><i></i><i></i><i></i></div></div>` : "")
  + (lastFailed ? `<div class="msg"><div class="msg-error"><span id="err-text"></span><button type="button" id="btn-retry">Reintentar</button></div></div>` : "");
  if (lastFailed) $("#err-text").textContent = lastFailed;
  if (typing || lastFailed) scrollDown();
}

$("#messages").addEventListener("click", async e => {
  const copyBtn = e.target.closest("[data-copy]");
  if (copyBtn) {
    try {
      await navigator.clipboard.writeText(messages[+copyBtn.dataset.copy].content);
      copyBtn.innerHTML = icon("check");
      setTimeout(() => { copyBtn.innerHTML = icon("copy"); }, 1500);
    } catch (err) { toast("No se pudo copiar."); }
  }
  if (e.target.closest("#btn-retry") && !sending) {
    lastFailed = false; sending = true; updateSend();
    await requestReply();
    sending = false; updateSend();
  }
});

function scrollDown(instant) {
  const s = $("#scroll");
  requestAnimationFrame(() => s.scrollTo({ top: s.scrollHeight, behavior: instant ? "instant" : "smooth" }));
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || sending) return;
  const model = getModel();
  if (!model.endpoint) { toast(`${model.name} aún no está disponible.`); return; }

  sending = true; lastFailed = false; updateSend();
  try {
    if (!currentId) {
      const { data, error } = await sb.from("conversations")
        .insert({ user_id: user.id, title: makeTitle(text), model: model.id }).select("id,title,model,updated_at").single();
      if (error) throw error;
      currentId = data.id; conversations.unshift(data); renderList();
    }
    const { data: saved, error: e2 } = await sb.from("messages")
      .insert({ conversation_id: currentId, user_id: user.id, role: "user", content: text, model: model.id })
      .select("id,role,content,model,created_at").single();
    if (e2) throw e2;
    messages.push(saved);
    renderMessages(); scrollDown();
    await requestReply();
  } catch (err) {
    lastFailed = "No se pudo guardar el mensaje. Revisa tu conexión y vuelve a intentarlo.";
    $("#input").value = text; autosize();
    renderMessages();
  } finally {
    sending = false; updateSend();
  }
}

/* Llama al backend (Render hoy, Colab mañana) y guarda la respuesta */
async function requestReply() {
  const model = getModel();
  renderMessages(true);
  const t0 = performance.now();
  try {
    const reply = await callBackend(model);
    const latency = Math.round(performance.now() - t0);
    const { data, error } = await sb.from("messages")
      .insert({ conversation_id: currentId, user_id: user.id, role: "assistant", content: reply, model: model.id, metadata: { latency_ms: latency } })
      .select("id,role,content,model,created_at").single();
    if (error) throw error;
    messages.push(data);
    const c = conversations.find(x => x.id === currentId);
    if (c) { c.updated_at = data.created_at; conversations = [c, ...conversations.filter(x => x !== c)]; }
    renderList();
    renderMessages(); scrollDown();
  } catch (err) {
    lastFailed = err.name === "AbortError"
      ? `${model.name} tardó demasiado en responder. Si el servidor estaba dormido, vuelve a intentarlo.`
      : (err.userMessage || "No se pudo obtener respuesta. Vuelve a intentarlo.");
    renderMessages();
  }
}

async function callBackend(model) {
  const history = messages.slice(-CONFIG.HISTORY_LIMIT).map(m => ({ role: m.role, content: m.content }));
  const last = history[history.length - 1];
  const headers = { "Content-Type": "application/json" };
  if (model.sendAuthToken) {
    const { data } = await sb.auth.getSession();
    if (data.session) headers.Authorization = "Bearer " + data.session.access_token;
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.REQUEST_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(model.endpoint, {
      method: "POST", headers, signal: ctrl.signal,
      body: JSON.stringify({
        message: last.content,                 // último mensaje del usuario
        history: history.slice(0, -1),         // turnos anteriores [{role, content}]
        conversation_id: currentId,
        user_id: user.id,
        model: model.id
      })
    });
  } catch (err) {
    if (err.name === "AbortError") throw err;
    const e = new Error("network"); e.userMessage = `No se pudo conectar con ${model.name}. Comprueba que el servidor está activo.`; throw e;
  } finally { clearTimeout(timer); }

  if (!res.ok) { const e = new Error("http " + res.status); e.userMessage = `${model.name} respondió con un error (${res.status}).`; throw e; }
  const data = await res.json().catch(() => null);
  const reply = extractReply(data);
  if (!reply) { const e = new Error("empty"); e.userMessage = `${model.name} devolvió una respuesta vacía.`; throw e; }
  return reply;
}

/* Acepta los formatos de respuesta más habituales */
function extractReply(d) {
  if (!d) return "";
  if (typeof d === "string") return d.trim();
  const v = d.reply ?? d.response ?? d.text ?? d.answer ?? d.output ?? d.message
    ?? (d.choices && d.choices[0] && (d.choices[0].message ? d.choices[0].message.content : d.choices[0].text));
  if (typeof v === "string") return v.trim();
  if (v && typeof v.content === "string") return v.content.trim();
  return "";
}

/* =====================================================================
   Compositor
   ===================================================================== */
const input = $("#input");
function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
  updateSend();
}
function updateSend() { $("#send").disabled = sending || !input.value.trim(); }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#composer").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value;
  if (!text.trim() || sending) return;
  input.value = ""; autosize();
  sendMessage(text);
});

/* =====================================================================
   Selector de modelo, menús y barra lateral
   ===================================================================== */
function setModelLabel() { $("#model-name").textContent = getModel().name; }

$("#model-btn").onclick = e => {
  e.stopPropagation();
  openPopover($("#model-btn"), CONFIG.MODELS.map(m => `
    <button type="button" data-act="${m.id}" ${m.endpoint ? "" : "disabled"}>
      <span class="opt-text">${esc(m.name)}<small>${m.endpoint ? esc(m.description) : "Próximamente"}</small></span>
      ${m.id === modelId ? icon("check") : ""}
    </button>`).join(""),
    id => { modelId = id; store.set("pnova.model", id); setModelLabel(); });
};

$("#user-btn").onclick = e => {
  e.stopPropagation();
  openPopover($("#user-btn"), `<button type="button" data-act="logout">${icon("logout")}Cerrar sesión</button>`,
    act => { if (act === "logout") logout(); }, null, true);
};

let popoverClose = null;
function openPopover(anchor, html, onPick, onClose, above) {
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover"; pop.id = "popover"; pop.setAttribute("role", "menu");
  pop.innerHTML = html;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8);
  let top = above ? r.top - ph - 6 : r.bottom + 6;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  pop.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    closePopover();
    onPick && onPick(act);
  });
  popoverClose = onClose || null;
}
function closePopover() {
  const p = $("#popover");
  if (p) p.remove();
  if (popoverClose) { popoverClose(); popoverClose = null; }
}
document.addEventListener("click", e => { if (!e.target.closest("#popover")) closePopover(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopover(); });
window.addEventListener("resize", closePopover);

function closeSidebarMobile() { document.body.classList.remove("sidebar-open"); }
$("#btn-collapse").onclick = () => {
  if (matchMedia("(max-width: 800px)").matches) closeSidebarMobile();
  else document.body.classList.add("sidebar-collapsed");
};
$("#btn-open").onclick = () => {
  if (matchMedia("(max-width: 800px)").matches) document.body.classList.add("sidebar-open");
  else document.body.classList.remove("sidebar-collapsed");
};
$("#overlay").onclick = closeSidebarMobile;
$("#btn-new").onclick = () => { newChat(); closeSidebarMobile(); };
$("#btn-new2").onclick = newChat;
$("#btn-search").onclick = () => {
  const box = $("#search-box");
  box.hidden = !box.hidden;
  if (!box.hidden) $("#search-input").focus();
  else { $("#search-input").value = ""; renderList(); }
};
$("#search-input").addEventListener("input", renderList);

(async function init() {
  setAuthMode("login");
  if (!configured) { showAuth(); return; }

  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  // No hacer llamadas a Supabase dentro del callback: se difieren con setTimeout
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (event === "SIGNED_OUT" || !session) { showAuth(); return; }
      if ((event === "SIGNED_IN" || event === "INITIAL_SESSION") && (!user || user.id !== session.user.id)) enterApp(session);
    }, 0);
  });

  const { data } = await sb.auth.getSession();
  if (data.session) { if (!user) enterApp(data.session); }
  else showAuth();
})();
</script>
