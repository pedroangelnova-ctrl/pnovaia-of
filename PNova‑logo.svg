<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <!-- Definición del degradado -->
  <defs>
    <linearGradient id="gradPNova" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#0A3D62;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00A8CC;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: P estilizada + estrella de 4 puntas -->
  <g transform="translate(10,10)">
    <!-- Parte circular de la “P” -->
    <path d="M30 0
             A30 30 0 0 1 30 60
             L20 60
             A20 20 0 0 0 20 0 Z"
          fill="url(#gradPNova)"/>

    <!-- Estrella de cuatro puntas integrada en la parte superior -->
    <polygon points="30,0 38,12 50,14 41,24 43,36 30,30 17,36 19,24 10,14 22,12"
             fill="url(#gradPNova)"/>

    <!-- Hoja curvada inferior (sugerencia de movimiento) -->
    <path d="M20 60 C5 70, 5 90, 30 90 C55 90, 55 70, 40 60 Z"
          fill="url(#gradPNova)"/>
  </g>

  <!-- Texto “PNova” -->
  <text x="110" y="65"
        font-family="Montserrat, Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#333333">PNova</text>
</svg>
